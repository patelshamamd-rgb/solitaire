<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solitaire — Deal Room</title>
  <meta name="description" content="Solitaire healthcare acquisition kanban — quiet luxury deal room." />
  <meta name="theme-color" content="#f3f1ec" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260918125028" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="app.js?v=20260918125028" defer></script>
</head>
<body>
  <div class="app">
    <div class="ambient" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand">
        <img src="favicon.svg" alt="" class="brand-mark" width="28" height="28" />
        <div class="brand-text">
          <h1 class="wordmark">Solitaire</h1>
          <p class="tagline">Deal room · Healthcare acquisitions</p>
        </div>
      </div>
      <div class="topbar-meta">
        <span id="deal-count" class="meta-chip">— deals</span>
        <span id="saved-chip" class="meta-chip saved-chip" hidden>Saved on this device</span>
        <button type="button" id="download-backup" class="btn-ghost" title="Download workspace backup JSON">Download workspace backup</button>
        <button type="button" id="reset-stages" class="btn-ghost" title="Clear saved workspace overrides">Reset workspace</button>
      </div>
    </header>

    <section class="daily-banner" id="daily-banner" aria-live="polite">
      <div class="banner-date" id="banner-date">—</div>
      <div class="banner-stats">
        <div class="stat">
          <span class="stat-label">Waiting on me</span>
          <span class="stat-value waiting-me" id="stat-waiting-me">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Untouched 7+ days</span>
          <span class="stat-value untouched" id="stat-untouched">0</span>
        </div>
      </div>
      <p class="hottest" id="hottest-deal">—</p>
    </section>

    <section class="filters" id="filters">
      <label>
        Priority
        <select id="filter-priority">
          <option value="">All</option>
        </select>
      </label>
      <label>
        Category
        <select id="filter-category">
          <option value="">All</option>
        </select>
      </label>
      <label>
        State
        <select id="filter-state">
          <option value="">All</option>
        </select>
      </label>
      <label>
        Waiting On
        <select id="filter-waiting">
          <option value="">All</option>
        </select>
      </label>
      <button type="button" id="clear-filters" class="btn-ghost">Clear</button>
    </section>

    <main class="board-wrap">
      <div class="board" id="board" role="list"></div>
    </main>

    <footer class="footer">
      <span>Workspace saves on this device · Seed: deals.json</span>
    </footer>
  </div>

  <!-- Detail drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="deal-drawer" class="deal-drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
    <header class="drawer-header">
      <h2 id="drawer-title" class="drawer-title">Deal</h2>
      <button type="button" id="drawer-close" class="btn-ghost drawer-close" aria-label="Close">Close</button>
    </header>
    <div class="drawer-body">
      <label class="drawer-field">
        <span class="drawer-label">Stage</span>
        <select id="drawer-stage"></select>
      </label>
      <div class="drawer-facts fact-grid" id="drawer-facts"></div>
      <div class="drawer-listing-actions" id="drawer-listing-actions"></div>
      <div class="drawer-broker-big" id="drawer-broker-big" hidden></div>
      <label class="drawer-field">
        <span class="drawer-label">Next Action</span>
        <textarea id="drawer-next-action" rows="3" placeholder="What to do next…"></textarea>
      </label>
      <label class="drawer-field">
        <span class="drawer-label">Next Action Due Date</span>
        <input type="date" id="drawer-next-due" />
      </label>
      <label class="drawer-field">
        <span class="drawer-label">Notes</span>
        <textarea id="drawer-notes" rows="8" placeholder="Most recent note / full notes log…"></textarea>
      </label>
      <p class="drawer-hint">Edits save automatically on this device.</p>
      <p class="drawer-id" id="drawer-deal-id"></p>
    </div>
  </aside>
</body>
</html>
